# Render Blueprint — WareTrack API (DEC-58). PostgreSQL trên Neon (DEC-67), web trên Vercel (DEC-52).
# Dùng: Render Dashboard → New → Blueprint → chọn repo này. Secret (sync: false) nhập trên dashboard.
services:
  - type: web
    name: waretrack-api
    runtime: docker
    plan: free # Free instance ngủ sau ~15 phút không có request; lần gọi đầu mất ~1 phút để dậy
    region: singapore # cùng vùng với database Neon (ap-southeast-1) để truy vấn không đi vòng qua Mỹ
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    autoDeploy: false # deploy do GitHub Actions gọi deploy hook sau khi CI xanh (.github/workflows/api.yml)
    envVars:
      - key: NODE_ENV
        value: production
      # Chuỗi kết nối TRỰC TIẾP của Neon (tắt "Connection pooling"; có ?sslmode=require) — Prisma migrate cần kết nối trực tiếp
      - key: DATABASE_URL
        sync: false
      # Origin của web trên Vercel, ví dụ https://waretrack.vercel.app (nhiều origin cách nhau bằng dấu phẩy)
      - key: WEB_ORIGIN
        sync: false
      # Khóa ES256 dạng PEM (xuống dòng viết \n) — sinh bằng: node apps/api/scripts/gen-jwt-keys.mjs
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      # Web (vercel.app) và API (onrender.com) khác site → cookie refresh phải SameSite=None; Secure (mục 12.7)
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_ON_EMPTY
        value: "true"
      # Dựng và chạy kịch bản xe/xe nâng giống video demo (DemoDirector, DEC-51)
      - key: DEMO_DIRECTOR
        value: "true"
      # ── Vận hành thật (DEC-62): đổi SEED_ON_EMPTY và DEMO_DIRECTOR thành "false", rồi bỏ comment hai secret dưới
      #    để API tạo admin đầu tiên khi database chưa có user.
      # - key: BOOTSTRAP_ADMIN_USERNAME
      #   sync: false
      # - key: BOOTSTRAP_ADMIN_PASSWORD
      #   sync: false
