name: UI – build & deploy

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"
  pull_request:
    paths:
      - "ui/**"
  workflow_dispatch:

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ui

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ui-production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: dist
      # TODO: copy ./dist lên server Linux (rsync/SSH) để Nginx phục vụ, hoặc đóng gói image Nginx.
      - run: echo "Deploy UI từ ./dist tới môi trường ui-production"
