name: BE – build & deploy

on:
  push:
    branches: [main]
    paths:
      - "be/**"
      - ".github/workflows/be.yml"
  pull_request:
    paths:
      - "be/**"
  workflow_dispatch:

concurrency:
  group: be-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: be

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: be/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: be-production
    steps:
      - uses: actions/checkout@v4
      # TODO: build Docker image từ be/Dockerfile, push registry, rồi SSH vào server Linux
      #       chạy `docker compose pull && docker compose up -d` (+ `prisma migrate deploy`).
      - run: echo "Deploy BE tới môi trường be-production"
