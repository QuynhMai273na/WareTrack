version: 2
updates:
  - package-ecosystem: npm # đọc được pnpm-lock.yaml của workspace
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Bản major (TypeScript 7, Prisma 7, Vite 8…) cần sửa code → nâng chủ động từng PR, không gom tự động
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Chỉ nâng trong cùng dòng Node LTS (vd 24.x); đổi major Node làm bằng PR riêng cùng CI
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
