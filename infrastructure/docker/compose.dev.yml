# Hạ tầng cho môi trường dev local: PostgreSQL + MinIO (không có Redis — DEC-05)
name: waretrack-dev

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: waretrack
      POSTGRES_PASSWORD: waretrack
      POSTGRES_DB: waretrack
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waretrack"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
